{% extends "base.html" %}
{% block title %}Fehler {{ status_code }} — Moneten-Tracker{% endblock %}

{% block body %}
<div class="login-shell">
  <div class="login-card text-center">
    <div class="brand-mark" style="margin:0 auto 14px; width:40px; height:40px; border-radius:10px; display:flex; align-items:center; justify-content:center; background:var(--danger); color:var(--bg-page);">!</div>
    <h1 style="font-size:18px">Fehler {{ status_code }}</h1>
    <p class="muted text-sm">{{ detail }}</p>
    <div class="mt-4">
      <a class="btn" href="/">Zur Übersicht</a>
    </div>
  </div>
</div>
{% endblock %}
